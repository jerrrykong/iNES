; ==========================================================
; iNES 界面语言文件 —— 繁體中文（台灣）
;
; 规则:
;   1) 编码 UTF-8 无 BOM, 换行 LF;
;   2) 左侧 key 与 lang/en.ini 保持一致(不要改动 key);
;   3) 占位符(%s %d %u %ld %lu %02X …)的数量与顺序必须与英文一致;
;   4) 缺的条目会自动回退英文; 多余的 key 会被忽略。
;
; 本文件以 lang/zh-CN.ini 为底本转写, 并按台湾用语调整术语:
;   内存→記憶體 / 线程→執行緒 / 端口→連接埠 / 服务器→伺服器 / 客户机→用戶端 /
;   协议→協定 / 存档→存檔 / 精灵→精靈 / 手柄→手把 / 复位→重設 / 调试→偵錯 /
;   网络→網路 / 局域网→區域網路 / 支持→支援 / 覆盖→覆寫 / 字节→位元組
; ==========================================================

[meta]
id = "zh-TW"
name = "繁體中文"

