; ==========================================================
; iNES 界面语言文件 —— 阿拉伯语（العربية）
;
; 规则:
;   1) 编码 UTF-8 无 BOM, 换行 LF;
;   2) 左侧 key 与 lang/en.ini 保持一致(不要改动 key);
;   3) 占位符(%s %d %u %ld %lu %02X …)的数量与顺序必须与英文一致;
;   4) 缺的条目会自动回退英文; 多余的 key 会被忽略。
;
; 术语与数据(ROM / CHR / PRG / Mapper / OAM / DMA / CPU …)保持英文。
; 注: 当前两端 UI 尚未做 RTL（从右到左）布局镜像, 本文件只提供译文,
; 排版仍按 LTR 呈现; 将来做 RTL 时只需改布局层, 不必动本文件。
; ==========================================================

