; ==========================================================
; iNES 界面语言文件 —— 英文模板(由 comm/i18n_en.c 自动生成, 请勿手工编辑)
;
; 新增一种语言的步骤:
;   1) 复制本文件为 <id>.ini(如 ja.ini);
;   2) 在文件头补上 [meta] 段:  id = "ja"   name = "日本語";
;   3) 逐条翻译等号右侧的值, 左侧 key 保持不动;
;   4) 占位符(%s %d %u %ld %lu %02X …)的数量与顺序必须与英文一致(%% 除外);
;   5) 存为 UTF-8 无 BOM、换行 LF, 放到 <数据目录>/lang/ 或程序目录/lang/ 下。
;   6) 跑 tools/i18n_check 校验后提交。
;
; 说明: 缺的条目会自动回退英文; 多余的 key 会被忽略并写日志。
; ==========================================================

